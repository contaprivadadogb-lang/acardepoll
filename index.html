<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AcardePoll</title>
<style>
  html,body{margin:0;padding:0;background:#0a3d0a;overflow:hidden;touch-action:none;
    font-family:sans-serif;-webkit-user-select:none;user-select:none;}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:8px 12px;color:#fff;background:rgba(0,0,0,.55);font-size:15px;z-index:5}
  #msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;
    font-size:22px;font-weight:bold;text-shadow:2px 2px 4px #000;z-index:6;pointer-events:none}
  canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<div id="hud"><span id="p1">Você: —</span><span id="p2">CPU: —</span><span id="turn">Sua vez</span></div>
<div id="msg"></div>
<canvas id="cv"></canvas>
<script src="game.js"></script>
</body>
</html>
