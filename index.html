<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AcardePoll</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;touch-action:none;
    font-family:'Segoe UI',Roboto,sans-serif;-webkit-user-select:none;user-select:none;
    background:radial-gradient(ellipse at 50% 35%, #163449 0%, #0a1c28 60%, #050e15 100%);}

  /* ---- Tela de login ---- */
  #login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:26px;z-index:20;
    background:radial-gradient(ellipse at 50% 30%, #1a3d55 0%, #0a1c28 65%, #040d14 100%);}
  #login .ball8{width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #666 0%, #141414 55%);
    box-shadow:0 8px 20px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
  #login .ball8 span{width:28px;height:28px;border-radius:50%;background:#fff;
    color:#141414;font-weight:bold;font-size:14px;display:flex;align-items:center;justify-content:center}
  #login h1{color:#fdf6e3;font-size:36px;margin:0;letter-spacing:1px;
    text-shadow:0 3px 10px rgba(0,0,0,.6)}
  #playBtn{font-size:22px;font-weight:700;color:#2a1608;border:none;cursor:pointer;
    padding:14px 54px;border-radius:32px;letter-spacing:.5px;
    background:linear-gradient(#ffe08a,#e6a92e);box-shadow:0 6px 16px rgba(0,0,0,.5);}
  #playBtn:active{transform:translateY(2px);box-shadow:0 3px 10px rgba(0,0,0,.5);}

  /* ---- Jogo ---- */
  #game{display:none;flex-direction:column;height:100%;box-sizing:border-box}
  #hud{display:flex;justify-content:space-between;align-items:center;gap:8px;
    color:#fdf6e3;font-size:14px;padding:10px 10px 6px;flex:0 0 auto}
  #hud span{background:linear-gradient(#3a2415,#241408);border:1px solid #c9a227;
    border-radius:20px;padding:6px 14px;box-shadow:0 2px 6px rgba(0,0,0,.5);
    font-weight:600;letter-spacing:.2px;transition:color .2s}
  #turn{background:linear-gradient(#0d3550,#0a1c28)!important;border-color:#2f8dc4!important}
  #tableWrap{position:relative;flex:1 1 auto;display:flex;align-items:center;
    justify-content:center;min-height:0;min-width:0}
  #msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fdf6e3;
    font-size:22px;font-weight:bold;text-shadow:2px 2px 4px #000;z-index:6;pointer-events:none;
    text-align:center;width:90%}
  canvas{display:block;box-shadow:0 10px 40px rgba(0,0,0,.6);border-radius:10px;
    max-width:100%;max-height:100%}

  #rotateHint{display:none;position:fixed;inset:0;z-index:30;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;color:#fdf6e3;text-align:center;
    background:rgba(4,13,20,.95);padding:0 30px}
  #rotateHint .icon{font-size:46px;animation:rot 1.6s ease-in-out infinite}
  #rotateHint p{margin:0;font-size:17px}
  @keyframes rot{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
</style>
</head>
<body>

<div id="rotateHint"><div class="icon">📱</div><p>Gire seu aparelho na horizontal para jogar</p></div>

<div id="login">
  <div class="ball8"><span>8</span></div>
  <h1>AcardePoll</h1>
  <button id="playBtn">Jogar</button>
</div>

<div id="game">
  <div id="hud"><span id="p1">Você: —</span><span id="p2">CPU: —</span><span id="turn">Sua vez</span></div>
  <div id="tableWrap">
    <div id="msg"></div>
    <canvas id="cv"></canvas>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
